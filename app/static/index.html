<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>TOS Web GUI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --fg: #1f2328;
      --muted: #57606a;
      --bg: #f6f8fa;
      --card: #ffffff;
      --border: #d0d7de;
      --border-soft: #eaeef2;
      --accent: #0969da;
      --accent-bg: #ddf4ff;
      --danger: #cf222e;
      --danger-bg: #ffebe9;
      --ok: #1a7f37;
      --ok-bg: #dafbe1;
      --row-hover: #f6f8fa;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", sans-serif;
      color: var(--fg);
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }
    header {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .grow { flex: 1; min-width: 240px; }
    h1 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
    }
    h1 .v {
      font-size: 11px;
      color: var(--muted);
      font-weight: 400;
      margin-left: 6px;
    }
    input[type=text] {
      padding: 6px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      flex: 1;
    }
    button, label.btn {
      padding: 5px 12px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f6f8fa;
      cursor: pointer;
      color: var(--fg);
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      line-height: 1.4;
    }
    button:hover, label.btn:hover { background: #eaeef2; }
    button:disabled { opacity: .4; cursor: not-allowed; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button.primary:hover { background: #0860c4; }
    button.primary:disabled { background: var(--accent); }
    button.danger { background: #fff; color: var(--danger); border-color: #ffd7d5; }
    button.danger:hover { background: var(--danger-bg); }
    button.danger:disabled { background: #fff; color: #cf222e88; border-color: #ffd7d588; }
    button.ghost { background: transparent; border-color: transparent; padding: 4px 8px; }
    button.ghost:hover { background: var(--border-soft); }

    /* 刷新按钮：导航栏的高频操作，单独放大作为视觉重点 */
    #btn-refresh {
      font-size: 17px;
      line-height: 1;
      padding: 6px 10px;
      border-radius: 8px;
    }
    #btn-refresh:hover {
      background: var(--accent-bg);
      color: var(--accent);
    }

    .crumbs {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-wrap: wrap;
      font-size: 13px;
    }
    .crumbs a {
      color: var(--accent);
      text-decoration: none;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .crumbs a:hover { background: var(--accent-bg); }
    .crumbs .sep { color: var(--muted); }
    .crumbs .current {
      font-weight: 600;
      padding: 2px 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    main {
      flex: 1;
      padding: 16px 16px 220px;  /* 给底部任务面板留空间 */
      overflow: auto;
    }
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    th, td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-soft);
      white-space: nowrap;
    }
    th {
      background: #f6f8fa;
      color: var(--muted);
      font-weight: 500;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0;
    }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr:last-child td { border-bottom: none; }
    td.name {
      width: 100%;
      max-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    td.name .entry {
      color: var(--fg);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    td.name a.entry {
      cursor: pointer;
    }
    td.name a.entry:hover { color: var(--accent); }
    td.name .entry.dir { font-weight: 500; }
    td.size, td.mtime {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12.5px;
    }
    td.size .size-calc {
      color: var(--accent);
      cursor: pointer;
      font-family: inherit;
    }
    td.size .size-calc:hover { text-decoration: underline; }
    td.actions {
      text-align: right;
    }
    td.actions button {
      margin-left: 4px;
    }
    .empty {
      padding: 32px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    .status {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .status.err {
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid #ffd7d5;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
    }
    .status.info {
      background: var(--accent-bg);
      color: var(--accent);
      border: 1px solid #b6e3ff;
    }
    .raw {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
    }
    .raw summary {
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .raw pre {
      margin: 8px 0 0;
      background: #0d1117;
      color: #e6edf3;
      padding: 12px;
      border-radius: 6px;
      max-height: 280px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    /* ----- 右下任务浮层 ----- */
    #task-panel {
      position: fixed;
      right: 16px;
      bottom: 16px;
      width: 520px;
      max-width: calc(100vw - 32px);
      max-height: 70vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 1000;
    }
    .task-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
      font-size: 12.5px;
      transition: opacity .3s ease;
    }
    .task-card.fading { opacity: 0; }
    .task-head {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .task-name {
      flex: 1;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .task-kind {
      font-size: 14px;
    }
    .task-state {
      padding: 1px 6px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .task-state.pending  { background: var(--border-soft); color: var(--muted); }
    .task-state.running  { background: var(--accent-bg); color: var(--accent); }
    .task-state.done     { background: var(--ok-bg); color: var(--ok); }
    .task-state.error    { background: var(--danger-bg); color: var(--danger); }
    .task-state.cancelled{ background: var(--border-soft); color: var(--muted); }
    .task-close {
      cursor: pointer;
      color: var(--muted);
      background: transparent;
      border: none;
      padding: 0 4px;
      font-size: 14px;
    }
    .task-close:hover { color: var(--fg); }
    .task-bar {
      height: 6px;
      background: var(--border-soft);
      border-radius: 3px;
      overflow: hidden;
      margin: 4px 0 6px;
    }
    .task-bar > div {
      height: 100%;
      background: var(--accent);
      transition: width .25s ease;
    }
    .task-bar.indeterminate > div {
      width: 30% !important;
      animation: indet 1.2s ease-in-out infinite;
    }
    .task-bar.error > div { background: var(--danger); width: 100% !important; }
    .task-bar.done  > div { background: var(--ok);     width: 100% !important; }
    @keyframes indet {
      0%   { margin-left: -30%; }
      100% { margin-left: 100%; }
    }
    .task-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
    }
    .task-meta .err {
      color: var(--danger);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    /* 终端风格的实时日志：复刻直接跑 tosutil cp -r 的观感 */
    .task-log {
      margin: 6px 0 0;
      padding: 8px 10px;
      background: #0d1117;
      color: #e6edf3;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11.5px;
      line-height: 1.45;
      max-height: 168px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .task-log .ln-last {
      color: #7ee787;  /* tosutil 进度行高亮：最新一帧 */
    }
    .task-log .ln-err {
      color: #ff7b72;
    }

  </style>
</head>
<body>
  <header>
    <div class="row">
      <h1>TOS Web GUI <span class="v">via tosutil</span></h1>
      <button class="ghost" id="btn-back"    title="后退 (Alt+←)">◀</button>
      <button class="ghost" id="btn-forward" title="前进 (Alt+→)">▶</button>
      <button class="ghost" id="btn-up"      title="返回上级">⬆</button>
      <button class="ghost" id="btn-home"    title="进入主目录">🏠</button>
      <button class="ghost" id="btn-set-home" title="把当前目录设为主目录">★</button>
      <button class="ghost" id="btn-refresh" title="刷新">⟳</button>
      <input id="addr" class="grow" type="text" placeholder="tos://bucket/path/  (留空 = 列出 buckets)" />
      <button id="btn-go" title="前往左侧输入框中的路径 (Enter)">Go</button>
    </div>
    <div class="row">
      <div id="crumbs" class="crumbs grow"></div>
    </div>
  </header>

  <main>
    <div id="status" class="hidden"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:55%">Name</th>
            <th style="width:18%">Size</th>
            <th style="width:22%">Modified</th>
            <th style="width:5%; text-align:right">Copy</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty hidden">（空目录）</div>
    </div>

    <details class="raw">
      <summary>tosutil 原始输出</summary>
      <pre id="raw">（操作后会显示在这里）</pre>
    </details>
  </main>

  <div id="task-panel"></div>

  <script>
    // =================================================================
    // 状态
    // =================================================================
    const state = {
      path: "",
      currentEntries: [],
      // 导航历史栈
      history: { stack: [""], idx: 0 },
      // 后端任务状态缓存：id -> task
      tasks: new Map(),
      // dirsize 任务 -> 它对应的目录 path（用来把结果写回行）
      pendingDirSize: new Map(),
    };

    const $ = (id) => document.getElementById(id);

    // =================================================================
    // 工具
    // =================================================================
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function fmtSize(n) {
      if (n === null || n === undefined) return "—";
      if (n === 0) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0, v = n;
      while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
      return (v < 10 ? v.toFixed(1) : Math.round(v)) + " " + units[i];
    }

    function parentPath(p) {
      if (!p || p === "tos://") return "";
      const stripped = p.replace(/\/+$/, "");
      if (stripped.indexOf("/", "tos://".length) === -1) return "";
      const i = stripped.lastIndexOf("/");
      return stripped.substring(0, i + 1);
    }

    function buildCrumbs(p) {
      const items = [{ label: "TOS", path: "" }];
      if (!p) return items;
      const stripped = p.replace(/^tos:\/\//, "").replace(/\/+$/, "");
      if (!stripped) return items;
      const parts = stripped.split("/");
      let cur = "tos://";
      for (const part of parts) {
        cur += part + "/";
        items.push({ label: part, path: cur });
      }
      return items;
    }

    function showStatus(kind, text) {
      const el = $("status");
      el.className = "status " + kind;
      el.textContent = text;
      el.classList.remove("hidden");
    }
    function clearStatus() {
      $("status").classList.add("hidden");
      $("status").textContent = "";
    }

    async function callJson(method, url, opts = {}) {
      const init = { method, ...opts };
      let resp;
      try { resp = await fetch(url, init); }
      catch (e) { return { success: false, error: "network error: " + e.message }; }
      let data;
      try { data = await resp.json(); }
      catch (e) { return { success: false, error: `non-JSON response (HTTP ${resp.status})` }; }
      if (!resp.ok && data && data.success === undefined) {
        data.success = false;
        if (!data.error && data.detail) data.error = data.detail;
      }
      return data;
    }

    function setRaw(data) {
      const stdout = (data && data.stdout) || "";
      const stderr = (data && data.stderr) || "";
      const error  = (data && data.error)  || "";
      const chunks = [];
      if (error)  chunks.push("ERROR: " + error);
      if (stdout) chunks.push(stdout.trimEnd());
      if (stderr) chunks.push("--- stderr ---\n" + stderr.trimEnd());
      $("raw").textContent = chunks.join("\n\n") || "（无输出）";
    }

    // =================================================================
    // 历史栈 + 导航
    // =================================================================
    function renderNavButtons() {
      $("btn-back").disabled    = state.history.idx <= 0;
      $("btn-forward").disabled = state.history.idx >= state.history.stack.length - 1;
      $("btn-up").disabled      = !state.path;
      renderHomeButtons();
    }

    // ----- 主目录 (持久化到 localStorage) -----
    const HOME_KEY = "tosWebGui.home";

    function getHome() {
      try { return localStorage.getItem(HOME_KEY) || ""; }
      catch { return ""; }
    }
    function setHomeValue(path) {
      try {
        if (path) localStorage.setItem(HOME_KEY, path);
        else localStorage.removeItem(HOME_KEY);
      } catch { /* 隐私模式等忽略 */ }
    }

    function renderHomeButtons() {
      const home = getHome();
      const btnHome = $("btn-home");
      const btnSet  = $("btn-set-home");

      btnHome.disabled = !home;
      btnHome.title = home ? `进入主目录 ${home}` : "尚未设置主目录（先用 ★ 设定）";

      const isCurrentHome = !!home && (state.path || "") === home;
      btnSet.textContent = isCurrentHome ? "✦" : "★";
      btnSet.title = isCurrentHome
        ? `当前目录已是主目录（点击取消）`
        : `把当前目录设为主目录 ${state.path ? `（${state.path}）` : "（请先进入某个目录）"}`;
      btnSet.disabled = !state.path && !isCurrentHome;
    }

    function goHome() {
      const home = getHome();
      if (!home) return;
      go(home);
    }

    function toggleHome() {
      const home = getHome();
      const cur = state.path || "";
      if (home && cur === home) {
        setHomeValue("");
        showStatus("info", "已取消主目录");
      } else {
        if (!cur) {
          showStatus("err", "请先进入某个目录再设为主目录");
          return;
        }
        setHomeValue(cur);
        showStatus("info", `已把 ${cur} 设为主目录，下次打开/刷新会自动进入`);
      }
      renderHomeButtons();
    }

    function go(path, { push = true } = {}) {
      const norm = path || "";
      if (push) {
        // 跳到已经在栈顶的同一路径不重复入栈
        const top = state.history.stack[state.history.idx];
        if (top !== norm) {
          state.history.stack = state.history.stack.slice(0, state.history.idx + 1);
          state.history.stack.push(norm);
          state.history.idx = state.history.stack.length - 1;
        }
      }
      doNavigate(norm);
    }

    function back() {
      if (state.history.idx <= 0) return;
      state.history.idx--;
      doNavigate(state.history.stack[state.history.idx]);
    }
    function forward() {
      if (state.history.idx >= state.history.stack.length - 1) return;
      state.history.idx++;
      doNavigate(state.history.stack[state.history.idx]);
    }

    async function doNavigate(path) {
      state.path = path || "";
      $("addr").value = state.path;
      renderCrumbs();
      renderNavButtons();
      clearStatus();

      const url = "/api/browse" + (state.path ? "?path=" + encodeURIComponent(state.path) : "");
      const data = await callJson("GET", url);
      setRaw(data);
      if (data.success === false) {
        showStatus("err", data.error || "请求失败");
        renderRows([]);
        return;
      }
      state.currentEntries = data.entries || [];
      renderRows(state.currentEntries);
    }

    function renderCrumbs() {
      const items = buildCrumbs(state.path);
      const html = items.map((it, idx) => {
        const isLast = idx === items.length - 1;
        if (isLast) return `<span class="current">${escapeHtml(it.label)}</span>`;
        return `<a data-path="${escapeHtml(it.path)}">${escapeHtml(it.label)}</a><span class="sep">/</span>`;
      }).join("");
      $("crumbs").innerHTML = html;
      $("crumbs").querySelectorAll("a[data-path]").forEach(a => {
        a.addEventListener("click", () => go(a.dataset.path));
      });
    }

    // =================================================================
    // 行渲染
    // =================================================================
    function renderRows(entries) {
      const tbody = $("rows");
      tbody.innerHTML = "";
      if (!entries.length) {
        $("empty").classList.remove("hidden");
        return;
      }
      $("empty").classList.add("hidden");

      const frag = document.createDocumentFragment();
      for (const e of entries) {
        const tr = document.createElement("tr");
        tr.dataset.path = e.path;
        tr.dataset.isDir = String(e.is_dir);

        // Name
        const tdName = document.createElement("td");
        tdName.className = "name";
        const nameEl = document.createElement(e.is_dir ? "a" : "span");
        nameEl.title = e.path;
        nameEl.classList.add("entry", e.is_dir ? "dir" : "file");
        nameEl.innerHTML = (e.is_dir ? "📁 " : "📄 ") + escapeHtml(e.name) + (e.is_dir ? "/" : "");
        if (e.is_dir) {
          nameEl.addEventListener("click", () => go(e.path));
        }
        tdName.appendChild(nameEl);

        // Size
        const tdSize = document.createElement("td");
        tdSize.className = "size";
        if (e.is_dir) {
          // 目录：Size 列本身就是「点我计算」的触发器
          const calc = document.createElement("a");
          calc.className = "size-calc";
          calc.textContent = "计算";
          calc.title = "点击递归扫描该目录、累加大小";
          calc.addEventListener("click", (ev) => { ev.stopPropagation(); startDirSize(e, tr); });
          tdSize.appendChild(calc);
        } else {
          tdSize.textContent = fmtSize(e.size);
        }

        // Modified
        const tdMtime = document.createElement("td");
        tdMtime.className = "mtime";
        tdMtime.textContent = e.mtime || "—";

        // Copy path
        const tdActions = document.createElement("td");
        tdActions.className = "actions";
        const copy = document.createElement("button");
        copy.className = "ghost";
        copy.title = "复制完整路径";
        copy.textContent = "⧉";
        copy.addEventListener("click", (ev) => {
          ev.stopPropagation();
          copyPath(e.path);
        });
        tdActions.appendChild(copy);

        tr.appendChild(tdName);
        tr.appendChild(tdSize);
        tr.appendChild(tdMtime);
        tr.appendChild(tdActions);
        frag.appendChild(tr);
      }
      tbody.appendChild(frag);
    }

    // =================================================================
    // 行内操作：copy / dirsize
    // =================================================================
    function fallbackCopyPath(path) {
      const ta = document.createElement("textarea");
      ta.value = path;
      ta.setAttribute("readonly", "");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.select();
      try {
        const ok = document.execCommand("copy");
        if (!ok) throw new Error("execCommand copy failed");
      } finally {
        ta.remove();
      }
    }

    async function copyPath(path) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          try {
            await navigator.clipboard.writeText(path);
          } catch {
            fallbackCopyPath(path);
          }
        } else {
          fallbackCopyPath(path);
        }
        showStatus("info", `已复制路径：${path}`);
      } catch (err) {
        showStatus("err", `复制失败：${err && err.message ? err.message : err}`);
      }
    }

    async function startDirSize(entry, rowEl) {
      const data = await callJson("POST", "/api/dirsize?path=" + encodeURIComponent(entry.path));
      if (data.success === false || !data.task_id) {
        showStatus("err", data.error || "无法启动 dirsize 任务");
        return;
      }
      state.pendingDirSize.set(data.task_id, entry.path);
      const sizeCell = rowEl.querySelector("td.size");
      sizeCell.innerHTML = '<span class="spinner"></span>';
      sizeCell.title = "计算中…";
    }

    function applyDirSizeResult(taskId, task) {
      const path = state.pendingDirSize.get(taskId);
      if (!path) return;
      state.pendingDirSize.delete(taskId);
      const tr = document.querySelector(`#rows tr[data-path="${CSS.escape(path)}"]`);
      if (!tr) return;
      const sizeCell = tr.querySelector("td.size");
      if (task.state === "done" && task.result) {
        const sz = fmtSize(task.result.bytes);
        const objs = task.result.objects;
        sizeCell.textContent = sz + (objs != null ? ` · ${objs}` : "");
        sizeCell.title = `${task.result.bytes} bytes` + (objs != null ? `, ${objs} objects` : "");
      } else {
        sizeCell.textContent = "!";
        sizeCell.title = task.error || "计算失败";
      }
    }

    // 任务面板（轮询 /api/tasks）
    // =================================================================
    const TASK_POLL_MS = 700;
    const TASK_FADE_AFTER_MS = 5000;

    async function pollTasks() {
      const data = await callJson("GET", "/api/tasks");
      if (data.success !== false && Array.isArray(data.tasks)) {
        for (const task of data.tasks) {
          const prev = state.tasks.get(task.id);
          state.tasks.set(task.id, task);
          // 状态变化时触发副作用
          if (!prev || prev.state !== task.state) {
            handleTaskTransition(prev, task);
          }
        }
      }
      renderTaskPanel();
    }

    function handleTaskTransition(prev, task) {
      if (task.state === "done") {
        if (task.kind === "dirsize") {
          applyDirSizeResult(task.id, task);
        }
      } else if (task.state === "error") {
        if (task.kind === "dirsize") {
          applyDirSizeResult(task.id, task);
        }
      }
    }

    // task_id -> { stuck: bool }；用于在 700ms 整面重渲后维持终端样式的「贴底」体验
    const taskLogState = new Map();

    function snapshotLogScroll() {
      const panel = $("task-panel");
      panel.querySelectorAll(".task-card[data-task-id]").forEach((card) => {
        const id = card.dataset.taskId;
        const pre = card.querySelector(".task-log");
        if (!pre) return;
        const slack = 8;
        const stuck = (pre.scrollTop + pre.clientHeight + slack) >= pre.scrollHeight;
        taskLogState.set(id, { stuck });
      });
    }

    function restoreLogScroll() {
      const panel = $("task-panel");
      panel.querySelectorAll(".task-card[data-task-id]").forEach((card) => {
        const id = card.dataset.taskId;
        const pre = card.querySelector(".task-log");
        if (!pre) return;
        const st = taskLogState.get(id);
        // 默认贴底；只有用户明确上滑过才保持不动（用 sentinel scrollTop=0）
        if (!st || st.stuck) {
          pre.scrollTop = pre.scrollHeight;
        }
      });
    }

    function renderTaskPanel() {
      const panel = $("task-panel");
      snapshotLogScroll();
      panel.innerHTML = "";
      const now = Date.now() / 1000;

      // 后端任务，按 started_at 倒序
      const all = Array.from(state.tasks.values());
      all.sort((a, b) => (b.started_at || 0) - (a.started_at || 0));
      const liveIds = new Set();
      for (const task of all) {
        // 终态超过 N 秒就从 UI 移除（后端仍保留）
        if (["done", "error", "cancelled"].includes(task.state)) {
          const finished = task.finished_at || task.started_at;
          if (finished && (now - finished) * 1000 > TASK_FADE_AFTER_MS) {
            // 同时让后端 dismiss 一次（best-effort）
            callJson("DELETE", `/api/task/${encodeURIComponent(task.id)}`);
            state.tasks.delete(task.id);
            taskLogState.delete(task.id);
            continue;
          }
        }
        liveIds.add(task.id);
        panel.appendChild(renderBackendTaskCard(task));
      }
      // 清理已不存在的任务的 scroll 状态
      for (const id of taskLogState.keys()) {
        if (!liveIds.has(id)) taskLogState.delete(id);
      }
      restoreLogScroll();
    }

    function kindIcon(kind) {
      return { dirsize: "📐" }[kind] || "•";
    }

    function renderBackendTaskCard(task) {
      const card = document.createElement("div");
      card.className = "task-card";
      card.dataset.taskId = task.id;

      const head = document.createElement("div");
      head.className = "task-head";
      head.innerHTML =
        `<span class="task-kind">${kindIcon(task.kind)}</span>` +
        `<span class="task-name" title="${escapeHtml(task.path)}">${escapeHtml(task.name)}</span>` +
        `<span class="task-state ${task.state}">${task.state}</span>`;
      const close = document.createElement("button");
      close.className = "task-close";
      close.title = task.state === "running" ? "取消" : "关闭";
      close.textContent = "✕";
      close.addEventListener("click", async () => {
        await callJson("DELETE", `/api/task/${encodeURIComponent(task.id)}`);
        state.tasks.delete(task.id);
        renderTaskPanel();
      });
      head.appendChild(close);

      const bar = document.createElement("div");
      bar.className = "task-bar";
      const fill = document.createElement("div");
      if (task.state === "done")     { bar.classList.add("done");  fill.style.width = "100%"; }
      else if (task.state === "error" || task.state === "cancelled") {
        bar.classList.add("error"); fill.style.width = "100%";
      } else if (task.progress != null) {
        fill.style.width = (task.progress * 100).toFixed(1) + "%";
      } else {
        bar.classList.add("indeterminate");
      }
      bar.appendChild(fill);

      const meta = document.createElement("div");
      meta.className = "task-meta";
      const leftBits = [];
      if (task.progress != null) leftBits.push((task.progress * 100).toFixed(0) + "%");
      if (task.kind === "dirsize" && task.state === "done" && task.result) {
        leftBits.push(fmtSize(task.result.bytes) + (task.result.objects != null ? ` · ${task.result.objects}` : ""));
      }
      const left = document.createElement("span");
      left.textContent = leftBits.join("  ");
      const right = document.createElement("span");
      if (task.state === "error" && task.error) {
        right.className = "err";
        right.title = task.error;
        right.textContent = task.error;
      }
      meta.appendChild(left);
      meta.appendChild(right);

      card.appendChild(head);
      card.appendChild(bar);
      card.appendChild(meta);

      const log = renderTaskLog(task);
      if (log) card.appendChild(log);
      return card;
    }

    function renderTaskLog(task) {
      const lines = Array.isArray(task.log_tail) ? task.log_tail : [];
      const hasErr = task.state === "error" && task.error;
      if (!lines.length && !hasErr) return null;

      const pre = document.createElement("pre");
      pre.className = "task-log";

      const parts = [];
      for (let i = 0; i < lines.length; i++) {
        const cls = i === lines.length - 1 ? " ln-last" : "";
        parts.push(`<span class="ln${cls}">${escapeHtml(lines[i])}</span>`);
      }
      if (hasErr) {
        parts.push(`<span class="ln ln-err">${escapeHtml(task.error)}</span>`);
      }
      pre.innerHTML = parts.join("\n");
      // 贴底逻辑由外层 restoreLogScroll 统一处理
      return pre;
    }

    // =================================================================
    // 绑定
    // =================================================================
    $("btn-back").addEventListener("click", back);
    $("btn-forward").addEventListener("click", forward);
    $("btn-up").addEventListener("click", () => go(parentPath(state.path)));
    $("btn-home").addEventListener("click", goHome);
    $("btn-set-home").addEventListener("click", toggleHome);
    $("btn-refresh").addEventListener("click", () => doNavigate(state.path));
    $("btn-go").addEventListener("click", () => go($("addr").value.trim()));
    $("addr").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") go($("addr").value.trim());
    });

    // 键盘快捷键：Alt+← / Alt+→（覆盖浏览器自带的 history 后退/前进）
    document.addEventListener("keydown", (ev) => {
      if (!ev.altKey || ev.metaKey || ev.ctrlKey) return;
      if (ev.key === "ArrowLeft")  { ev.preventDefault(); back();    }
      if (ev.key === "ArrowRight") { ev.preventDefault(); forward(); }
    });

    // 启动：如设了主目录，刷新/打开默认进入；否则照旧列 bucket
    renderNavButtons();
    (function bootstrap() {
      const home = getHome();
      if (home) {
        // 让历史栈的起点就是主目录，避免「后退」回到一个空白根
        state.history.stack = [home];
        state.history.idx = 0;
        doNavigate(home);
      } else {
        doNavigate("");
      }
    })();
    setInterval(pollTasks, TASK_POLL_MS);
  </script>
</body>
</html>
